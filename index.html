<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbits CX | Executive Advisory</title>
    <style>
        :root { 
            --umber: #1A110D;
            --maroon: #33140E;
            --terracotta: #802E1E;
            --rust: #A85426;
            --sandstone: #BF843E;
            --warm-tan: #DAB070;
            --bg-sand: #FAF6F0;
            --card-border: #E8DEC8;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: var(--umber); 
            background: var(--bg-sand); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card { 
            background: #FFFFFF; 
            border: 1px solid var(--card-border); 
            border-radius: 14px; 
            padding: 2.25rem 2rem 2.5rem 2rem; 
            max-width: 480px;
            margin: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(26, 17, 13, 0.08); 
        }

        /* Full Brand Logo Header */
        .brand-logo-full {
            width: 100%;
            max-width: 220px;
            height: auto;
            display: block;
            margin: 0 auto 1.25rem auto;
        }

        /* Clean Status Banner Without Dot */
        .status-banner { 
            display: inline-block;
            background: var(--bg-sand); 
            color: var(--terracotta); 
            border: 1px solid var(--warm-tan);
            padding: 0.55rem 1.25rem; 
            border-radius: 9999px; 
            font-size: 0.825rem; 
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 1.75rem;
            text-transform: uppercase;
        }

        .book-photo {
            width: 100%;
            height: auto;
            max-width: 360px;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 12px rgba(26, 17, 13, 0.12);
        }

        .tagline { 
            color: var(--rust); 
            font-weight: 700; 
            font-size: 1.1rem; 
            margin-bottom: 1rem; 
        }

        p { 
            color: #4A3B32; 
            font-size: 0.95rem; 
            line-height: 1.6; 
            margin-bottom: 1.75rem; 
        }

        .btn-amazon {
            display: block;
            background: var(--terracotta);
            color: #FFFFFF;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 6px rgba(128, 46, 30, 0.25);
        }

        .btn-amazon:hover {
            background: var(--maroon);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Full Brand Logo -->
        <img src="orbits cx gradient full logo.jpg" alt="Orbits CX Logo" class="brand-logo-full" onerror="this.src='orbits cx gradient full logo.png';">

        <!-- Status Badge (No Dot) -->
        <div class="status-banner">
            Full Website Under Construction
        </div>

        <!-- Book Image -->
        <img src="the CX Curve Book Picture 2.jpeg" alt="The CX Curve Book" class="book-photo">

        <div class="tagline">Executive Advisory & Strategic Alignment</div>
        <p>Our updated digital presence is currently under construction. In the meantime, learn how to rewire corporate DNA for relentless customer focus in <em>The CX Curve</em>.</p>

        <a href="https://www.amazon.com/dp/B0H7NTRCBB" target="_blank" rel="noopener noreferrer" class="btn-amazon">
            Order The CX Curve on Amazon &rarr;
        </a>
    </div>
</body>
</html>
