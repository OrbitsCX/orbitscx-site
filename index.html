<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbits CX | Coming Soon</title>
    <style>
        :root { --primary: #0F172A; --accent: #2563EB; --text: #334155; --bg: #F8FAFC; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: var(--text); 
            background: var(--bg); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card { 
            background: #fff; 
            border: 1px solid #E2E8F0; 
            border-radius: 12px; 
            padding: 3rem 2rem; 
            max-width: 500px;
            margin: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
        }
        h1 { color: var(--primary); font-size: 2.25rem; margin-bottom: 0.5rem; }
        .tagline { color: var(--accent); font-weight: 600; font-size: 1.1rem; margin-bottom: 1.5rem; }
        p { color: #64748B; font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
        .status { 
            display: inline-block; 
            background: #EFF6FF; 
            color: var(--accent); 
            padding: 0.5rem 1rem; 
            border-radius: 9999px; 
            font-size: 0.875rem; 
            font-weight: 600; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Orbits CX</h1>
        <div class="tagline">Executive Advisory & Strategic Alignment</div>
        <p>Our updated digital presence is currently under construction. Please check back soon for insights, diagnostic tools, and publication updates.</p>
        <div class="status">Website Under Construction</div>
    </div>
</body>
</html>
